stages:
  - build
  - release

image: docker:latest

services:
  - docker:dind

#### Multi-platform builds need a runner host with QEMU binfmt handlers registered
default:
  tags:
    - imagex

variables:
  DOCKER_REGISTRY: "epicsoft/openjdk"
  BUILD_PLATFORMS: "linux/amd64,linux/arm64"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

#### The tokens go in over stdin: '-p' would put them in the process list of the runner.
before_script:
  - echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USER" --password-stdin
  - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"

after_script:
  - docker logout
  - docker logout $CI_REGISTRY

#### Only latest version; a git tag skips these build jobs, its pipeline only creates the GitHub release
.notOnTags: &notOnTags
  - if: $CI_COMMIT_TAG == null

include:
  - local: openjdk11/11.0.33/.gitlab-ci.yml
    rules: *notOnTags
  - local: openjdk17/17.0.21/.gitlab-ci.yml
    rules: *notOnTags
  - local: openjdk21/21.0.13/.gitlab-ci.yml
    rules: *notOnTags
  - local: openjdk25/25.0.5/.gitlab-ci.yml
    rules: *notOnTags

#### Release only on the default branch
.releaseOnMain:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

#### Re-tagging copies the whole manifest list, so it must not go through
#### docker pull/tag/push - that would flatten the image to the runner platform
release11:
  extends: .releaseOnMain
  stage: release
  script:
    #### JDK 11
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jdk11
        -t $CI_REGISTRY_IMAGE:jdk11-latest
        -t $DOCKER_REGISTRY:jdk11
        -t $DOCKER_REGISTRY:jdk11-latest
        $CI_REGISTRY_IMAGE:jdk$OPENJDK11_IMAGE_TAG
    #### JRE 11
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jre11
        -t $CI_REGISTRY_IMAGE:jre11-latest
        -t $DOCKER_REGISTRY:jre11
        -t $DOCKER_REGISTRY:jre11-latest
        $CI_REGISTRY_IMAGE:jre$OPENJDK11_IMAGE_TAG

release17:
  extends: .releaseOnMain
  stage: release
  script:
    #### JDK 17
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jdk17
        -t $CI_REGISTRY_IMAGE:jdk17-latest
        -t $DOCKER_REGISTRY:jdk17
        -t $DOCKER_REGISTRY:jdk17-latest
        $CI_REGISTRY_IMAGE:jdk$OPENJDK17_IMAGE_TAG
    #### JRE 17
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jre17
        -t $CI_REGISTRY_IMAGE:jre17-latest
        -t $DOCKER_REGISTRY:jre17
        -t $DOCKER_REGISTRY:jre17-latest
        $CI_REGISTRY_IMAGE:jre$OPENJDK17_IMAGE_TAG

release21:
  extends: .releaseOnMain
  stage: release
  script:
    #### JDK 21
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jdk21
        -t $CI_REGISTRY_IMAGE:jdk21-latest
        -t $DOCKER_REGISTRY:jdk21
        -t $DOCKER_REGISTRY:jdk21-latest
        $CI_REGISTRY_IMAGE:jdk$OPENJDK21_IMAGE_TAG
    #### JRE 21
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jre21
        -t $CI_REGISTRY_IMAGE:jre21-latest
        -t $DOCKER_REGISTRY:jre21
        -t $DOCKER_REGISTRY:jre21-latest
        $CI_REGISTRY_IMAGE:jre$OPENJDK21_IMAGE_TAG

release25:
  extends: .releaseOnMain
  stage: release
  script:
    #### JDK 25
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jdk25
        -t $CI_REGISTRY_IMAGE:jdk25-latest
        -t $DOCKER_REGISTRY:jdk25
        -t $DOCKER_REGISTRY:jdk25-latest
        $CI_REGISTRY_IMAGE:jdk$OPENJDK25_IMAGE_TAG
    #### JRE 25
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jre25
        -t $CI_REGISTRY_IMAGE:jre25-latest
        -t $DOCKER_REGISTRY:jre25
        -t $DOCKER_REGISTRY:jre25-latest
        $CI_REGISTRY_IMAGE:jre$OPENJDK25_IMAGE_TAG
    #### JDK 25 Debian headless
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jdk25-debian-headless
        -t $CI_REGISTRY_IMAGE:jdk25-debian-headless-latest
        -t $DOCKER_REGISTRY:jdk25-debian-headless
        -t $DOCKER_REGISTRY:jdk25-debian-headless-latest
        $CI_REGISTRY_IMAGE:jdk$OPENJDK25_IMAGE_TAG-debian-headless
    #### JRE 25 Debian headless
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jre25-debian-headless
        -t $CI_REGISTRY_IMAGE:jre25-debian-headless-latest
        -t $DOCKER_REGISTRY:jre25-debian-headless
        -t $DOCKER_REGISTRY:jre25-debian-headless-latest
        $CI_REGISTRY_IMAGE:jre$OPENJDK25_IMAGE_TAG-debian-headless

releaseLatest:
  extends: .releaseOnMain
  stage: release
  variables:
    LATEST_TAG: $OPENJDK25_IMAGE_TAG
  script:
    #### JDK
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jdk
        -t $CI_REGISTRY_IMAGE:jdk-latest
        -t $DOCKER_REGISTRY:jdk
        -t $DOCKER_REGISTRY:jdk-latest
        $CI_REGISTRY_IMAGE:jdk$LATEST_TAG
    #### JRE, latest is the JRE
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jre
        -t $CI_REGISTRY_IMAGE:jre-latest
        -t $CI_REGISTRY_IMAGE:latest
        -t $DOCKER_REGISTRY:jre
        -t $DOCKER_REGISTRY:jre-latest
        -t $DOCKER_REGISTRY:latest
        $CI_REGISTRY_IMAGE:jre$LATEST_TAG
    #### JDK Debian headless
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jdk-debian-headless
        -t $CI_REGISTRY_IMAGE:jdk-debian-headless-latest
        -t $DOCKER_REGISTRY:jdk-debian-headless
        -t $DOCKER_REGISTRY:jdk-debian-headless-latest
        $CI_REGISTRY_IMAGE:jdk$LATEST_TAG-debian-headless
    #### JRE Debian headless
    - docker buildx imagetools create
        -t $CI_REGISTRY_IMAGE:jre-debian-headless
        -t $CI_REGISTRY_IMAGE:jre-debian-headless-latest
        -t $DOCKER_REGISTRY:jre-debian-headless
        -t $DOCKER_REGISTRY:jre-debian-headless-latest
        $CI_REGISTRY_IMAGE:jre$LATEST_TAG-debian-headless

uploadReadme:
  extends: .releaseOnMain
  stage: release
  script:
    #### Docker Hub takes at most 25,000 characters - counted in bytes here, which is stricter
    - |
      size=$(wc -c < README.md)
      if [ "$size" -gt 25000 ]; then
        echo "README.md has $size bytes, Docker Hub takes 25000"
        exit 1
      fi
    #### '-e NAME' without a value reads it from the environment, so the token stays out of the process list
    - DOCKERHUB_PASSWORD="$DOCKER_HUB_TOKEN" docker run --rm -v $PWD:/workspace
      -e DOCKERHUB_USERNAME=${DOCKER_HUB_USER}
      -e DOCKERHUB_PASSWORD
      -e DOCKERHUB_REPOSITORY=${DOCKER_REGISTRY}
      -e SHORT_DESCRIPTION="OpenJDK JDK and JRE images for Java 11, 17, 21 and 25 on Alpine and Debian - rebuilt weekly"
      -e README_FILEPATH='/workspace/README.md'
        peterevans/dockerhub-description:4

#### A git tag is the date of a CHANGELOG.md entry; its pipeline only turns that entry into the GitHub release
github-release:
  stage: release
  image: epicsoft/ci:latest
  services: []
  before_script: []
  after_script: []
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d{4}-\d{2}-\d{2}$/
  variables:
    GITHUB_REPO: "epicsoft-llc/${CI_PROJECT_NAME}"
  script:
    - |
      if [ -z "${GITHUB_TOKEN:-}" ]; then
        echo "GITHUB_TOKEN is empty - it is a protected variable, so the tag has to be protected"
        exit 1
      fi
      api="https://api.github.com/repos/${GITHUB_REPO}"
      #### curl reads the header from a file, so the token stays out of the process list
      auth_file=$(mktemp)
      printf 'Authorization: Bearer %s\n' "${GITHUB_TOKEN}" > "$auth_file"
      auth="@$auth_file"
      #### the lines below '## <date>' up to the next entry or the next '---', without the blank lines around them
      notes=$(awk -v head="## ${CI_COMMIT_TAG}" '
        $0 == head { found = 1; next }
        found && (/^## / || $0 == "---") { exit }
        found { line[++n] = $0 }
        END {
          while (n > 0 && line[n] ~ /^[[:space:]]*$/) n--
          for (i = 1; i <= n; i++) if (started || line[i] !~ /^[[:space:]]*$/) { started = 1; print line[i] }
        }' CHANGELOG.md)
      if [ -z "$notes" ]; then
        echo "CHANGELOG.md has no entry for ${CI_COMMIT_TAG}"
        exit 1
      fi
      if curl -sf -H "$auth" "$api/releases/tags/${CI_COMMIT_TAG}" > /dev/null; then
        echo "Release ${CI_COMMIT_TAG} already exists on GitHub"
        exit 0
      fi
      tries=0
      until curl -sf -H "$auth" "$api/git/ref/tags/${CI_COMMIT_TAG}" > /dev/null; do
        tries=$((tries + 1))
        if [ "$tries" -ge 60 ]; then
          echo "Tag ${CI_COMMIT_TAG} did not reach GitHub within 10 minutes - check the push mirror"
          exit 1
        fi
        sleep 10
      done
      jq -n --arg tag "${CI_COMMIT_TAG}" --arg body "$notes" '{tag_name: $tag, name: $tag, body: $body}' \
        | curl -sS --fail-with-body -X POST -H "$auth" -H "Accept: application/vnd.github+json" "$api/releases" -d @- > /dev/null
      echo "Release ${CI_COMMIT_TAG} created on GitHub"
